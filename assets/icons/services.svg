<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- NteK service-line marks. Technical drafting register: 24×24 grid,
     1.4 stroke, round caps/joins, no fills, no colour of their own —
     they inherit currentColor so the same sprite serves white and navy. -->

  <symbol id="i-01" viewBox="0 0 24 24"><!-- Field Engineering — deployed position -->
    <path d="M12 20.8c3.9-4.4 6-7.6 6-10a6 6 0 1 0-12 0c0 2.4 2.1 5.6 6 10z"/>
    <circle cx="12" cy="10.6" r="2.3"/>
  </symbol>

  <symbol id="i-02" viewBox="0 0 24 24"><!-- Infrastructure — rack units -->
    <rect x="3.6" y="4" width="16.8" height="4.6" rx="1.1"/>
    <rect x="3.6" y="9.7" width="16.8" height="4.6" rx="1.1"/>
    <rect x="3.6" y="15.4" width="16.8" height="4.6" rx="1.1"/>
    <path d="M6.6 6.3h.01M6.6 12h.01M6.6 17.7h.01"/>
  </symbol>

  <symbol id="i-03" viewBox="0 0 24 24"><!-- On-Demand Support — response window -->
    <circle cx="12" cy="12" r="8.2"/>
    <path d="M12 7.1V12l3.5 2.1"/>
  </symbol>

  <symbol id="i-04" viewBox="0 0 24 24"><!-- Managed IT — estate under management -->
    <rect x="4" y="4" width="16" height="16" rx="2.2"/>
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 4v2M12 18v2M4 12h2M18 12h2"/>
  </symbol>

  <symbol id="i-05" viewBox="0 0 24 24"><!-- Managed Cloud — cloud with a node -->
    <path d="M7.6 18.4a4.4 4.4 0 0 1-.4-8.78 5.4 5.4 0 0 1 10.4 1.08 3.85 3.85 0 0 1-.4 7.7z"/>
    <circle cx="12.2" cy="13.4" r="1.6"/>
  </symbol>

  <symbol id="i-06" viewBox="0 0 24 24"><!-- Oracle DBA — database -->
    <ellipse cx="12" cy="6.4" rx="6.9" ry="2.8"/>
    <path d="M5.1 6.4v11.2c0 1.55 3.09 2.8 6.9 2.8s6.9-1.25 6.9-2.8V6.4"/>
    <path d="M5.1 12c0 1.55 3.09 2.8 6.9 2.8s6.9-1.25 6.9-2.8"/>
  </symbol>

  <symbol id="i-07" viewBox="0 0 24 24"><!-- DRaaS — recovery from cloud -->
    <path d="M7.6 15.6a4.4 4.4 0 0 1-.4-8.78 5.4 5.4 0 0 1 10.4 1.08 3.85 3.85 0 0 1-.4 7.7"/>
    <path d="M12 11.6v8.2M9.3 17.1L12 19.8l2.7-2.7"/>
  </symbol>

  <symbol id="i-08" viewBox="0 0 24 24"><!-- On-Premise Backup — local appliance -->
    <rect x="3" y="6.6" width="18" height="10.8" rx="2.1"/>
    <path d="M3 12.4h18"/>
    <path d="M6.4 15.2h4.2"/>
    <path d="M17.3 9.4h.01"/>
  </symbol>

  <symbol id="i-09" viewBox="0 0 24 24"><!-- Software Solutions — built to fit -->
    <path d="M9.2 8.4L5.4 12l3.8 3.6M14.8 8.4L18.6 12l-3.8 3.6"/>
    <path d="M13.1 6.3l-2.2 11.4"/>
  </symbol>

</svg>
